spring.application.name=core-banking

# Server Port & Concurrency
server.port=8080
spring.threads.virtual.enabled=true

# Redis Cache Configuration
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=2000ms


# Kết nối độc lập vào COREBANKING_PDB (thay vì ORCL chung)
spring.datasource.url=jdbc:oracle:thin:@//localhost:1521/COREBANKING_PDB
spring.datasource.username=cbs_app
spring.datasource.password=cbs_password
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# HikariCP Connection Pool Optimization for Core Banking
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Flyway Migrations
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Spring Batch (uses same Oracle DB with metadata tables)
spring.batch.jdbc.initialize-schema=always
spring.batch.job.enabled=false
